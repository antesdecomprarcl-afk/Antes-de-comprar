# Verificacion diaria de precios.
#
# Corre en GitHub Actions (no en Netlify) por una razon concreta: necesita
# guardar lo que aprendio. Cada corrida escribe el precio del dia en el
# historial y lo commitea; ese historial acumulado es lo unico que nos permite
# despues afirmar que una rebaja es real. Un build de Netlify es efimero y no
# podria conservarlo.
#
# Al hacer push de los datos, Netlify reconstruye y publica solo.

name: Verificar precios

on:
  schedule:
    # 11:00 UTC = 07:00 u 08:00 en Chile segun horario de verano.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Cuantos productos verificar (vacio = el limite de config.json)'
        required: false
        type: string

permissions:
  contents: write

# Dos verificaciones a la vez se pisarian los datos.
concurrency:
  group: verificar-precios
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: npm test

      - name: Verificar precios en Mercado Libre
        id: verificar
        continue-on-error: true
        env:
          # Todos opcionales: sin ellos el verificador usa la API publica y,
          # si esa se cierra, lee la ficha publica del producto.
          MELI_ACCESS_TOKEN: ${{ secrets.MELI_ACCESS_TOKEN }}
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ inputs.limite }}" ]; then
            node src/verificar.mjs --limite "${{ inputs.limite }}"
          else
            node src/verificar.mjs
          fi

      - name: Construir el sitio (falla si los datos quedaron inconsistentes)
        run: npm run build

      - name: Guardar lo verificado
        run: |
          git config user.name  "verificador"
          git config user.email "actions@users.noreply.github.com"
          git add data/estado.json data/historial.jsonl data/categorias.json data/productos.json
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Precios verificados $(date -u +%Y-%m-%d)"
            # Si alguien empujo algo mientras corriamos, nos reordenamos encima.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Solo hace falta si Netlify no esta conectado al repositorio: cuando lo
      # esta, el push del paso anterior ya dispara el despliegue.
      - name: Avisar a Netlify (opcional)
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Sin NETLIFY_BUILD_HOOK: Netlify se entera por el push."
          else
            curl -fsS -X POST -d '{}' "$HOOK" && echo "Netlify avisado."
          fi

      - name: Fallar si no se pudo verificar nada
        if: steps.verificar.outcome == 'failure'
        run: |
          echo "La verificacion no pudo confirmar ningun producto."
          echo "Los fallos quedaron anotados igual. Para ver que camino se rompio:"
          echo "  npm run diagnostico"
          exit 1
