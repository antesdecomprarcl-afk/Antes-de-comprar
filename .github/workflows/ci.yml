# Revision de cada cambio: que los tests pasen y que el sitio compile.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
